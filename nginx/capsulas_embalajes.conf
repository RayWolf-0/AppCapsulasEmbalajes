# ==============================================================================
# CONFIGURACIÓN NGINX - CÁPSULAS DE EMBALAJE MAMUT
# Puerto: 8080 (Reemplazo del entorno Flutter)
# Ubicación destino en servidor: /etc/nginx/conf.d/capsulas_embalajes.conf
# ==============================================================================

server {
    listen 8080;
    server_name _;

    # Ruta absoluta al directorio dist/ compilado con Vite
    root /home/ctest/AppCapsulasEmbalajes/dist;
    index index.html;

    # Tamaño máximo de carga para documentos
    client_max_body_size 50M;

    # Enrutamiento para SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Configuración de entrega optimizada para recursos estáticos y multimedia (Offline)
    location ~* \.(webm|mp4|pdf|png|jpg|jpeg|svg|ico|ttf|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    # Optimización de compresión Gzip para red interna
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Logs específicos del servicio
    access_log /var/log/nginx/capsulas_embalajes_access.log;
    error_log /var/log/nginx/capsulas_embalajes_error.log warn;
}
